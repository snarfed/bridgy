# CircleCI automatically reads this file from our repo and uses it for
# configuration. Docs:
# https://circleci.com/docs/2.0/configuration-reference/
# https://circleci.com/docs/2.0/sample-config/
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.14-node
      - image: guibeira/datastore-emulator:0.1.14
        command: ["--host-port", "0.0.0.0:8089", "--no-store-on-disk"]

    steps:
      - checkout

      - restore_cache:
          keys:
            - venv-npm-8-{{ .Branch }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements.pinned.txt" }}-{{ checksum "browser-extension/package.json" }}
            - venv-npm-8-{{ .Branch }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements.pinned.txt" }}
            - venv-npm-8-{{ .Branch }}-{{ checksum "requirements.txt" }}
            - venv-npm-8-{{ .Branch }}
            - venv-npm-8

      - run:
          name: Base dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y automake ca-certificates libtool pkg-config

      - run:
          name: Python dependencies
          command: |
            pip install -U pip flake8
            pip -V
            # make sure we install these at head, below
            pip uninstall -y arroba brevity granary lexrpc oauth-dropins requests_oauth2client pywebutil
            pip install -U -r requirements.txt
            pip install coverage coveralls

      - run:
          name: JavaScript dependencies
          command: |
            node --version
            cd browser-extension
            npm install

      - run:
          name: Python tests
          command: |
            curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://localhost:8089/
            python -m coverage run --source=. --omit=admin.py,appengine_config.py,logs.py,scripts/\*,tests/\* -m unittest discover
            python -m coverage html -d /tmp/coverage_html
            if [ "$COVERALLS_REPO_TOKEN" != "" ]; then python -m coveralls || true; fi

            # check for unintentionally overridden test methods
            # https://flake8.pycqa.org/en/latest/user/error-codes.html#error-codes
            # https://flake8.pycqa.org/en/latest/user/options.html#cmdoption-flake8-select
            flake8 --select=F811 tests/test_*.py

      - run:
          name: JavaScript tests
          command: |
            cd browser-extension
            npm run test

      - save_cache:
          key: venv-npm-8-{{ .Branch }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements.pinned.txt" }}-{{ checksum "browser-extension/package.json" }}
          paths:
            - browser-extension/node_modules
            - /home/circleci/.pyenv

      - store_artifacts:
          path: /tmp/coverage_html
